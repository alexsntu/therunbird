<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ company_name }}: Message title</title>
  <style type="text/css">
    /* ==========================================================
       RunBird mail palette — LIGHT-ONLY VARIANT, matches the
       Рабочий проект светлый/ site track (white bg, #D1382A red
       accent for both text and filled surfaces — see rb-work-light.css).
       bg outer:      #FAF9F7  (site's "elevated panel" off-white)
       bg card:       #FFFFFF
       bg footer:     #FAF9F7
       border:        rgba(18,18,18,.08)
       text:          #121212
       text secondary:#6E6A63
       accent (red):  #D1382A
       accent hover:  #A82C20
       No dark title-bar tier — simplified 2026-09-08 to announce bar +
       logo only; the per-email {{title}} now renders as plain text at
       the top of the message body instead of its own dark band.
       Note: styles live here (header). Footer template reuses these
       classes, so header + footer must always be deployed together.
       ========================================================== */

    #outlook a {
      padding: 0;
    }

    body {
      width: 100% !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      margin: 0;
      padding: 0;
      background-color: #FAF9F7;
    }

    img {
      outline: none;
      text-decoration: none;
      -ms-interpolation-mode: bicubic;
    }

    a {
      outline: none;
    }

    a img {
      border: none;
    }

    .image_fix {
      display: block;
    }

    .rb-mail-announce > td {
      background-color: #D1382A;
      padding: 8px 20px;
      text-align: center;
      color: #FFFFFF !important;
      font-family: 'Barlow Condensed', Helvetica, Arial, sans-serif !important;
      font-size: 11px !important;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .message-header {
      background-color: #FFFFFF;
    }

    .message-header > td {
      padding: 22px 30px 18px 30px;
    }

    .rb-mail-title {
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-weight: 700;
      color: #121212;
      font-family: 'Barlow Condensed', Helvetica, Arial, sans-serif;
      margin: 0 0 18px 0;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(18,18,18,.08);
    }

    .message-title > td,
    .message-body > td {
      padding: 30px;
    }

    .message-footer > td {
      padding: 24px 30px;
      background-color: #FAF9F7;
    }

    .message-copyright > td {
      padding: 14px 30px 18px;
    }

    .message-header td,
    .message-title td,
    .message-body th, .message-body td,
    .message-footer th, .message-footer td,
    .message-copyright th, .message-copyright td {
      color: #121212;
      font-size: 15px;
      font-family: 'Inter', Helvetica, Arial, sans-serif;
    }

    .message-footer {
      border-top: 1px solid rgba(18,18,18,.08);
    }

    .message-body table th,
    .message-footer table th {
      text-transform: uppercase;
      border-bottom: 1px solid rgba(18,18,18,.08);
      text-align: left;
    }

    .message-body table td,
    .message-footer table td {
      padding: 5px;
    }

    .message-footer table th{
        border: none;
    }

    .message-footer td {
      color: #6E6A63;
    }

    .footer-contact__title {
      margin: 0px;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-size: 14px !important;
      font-weight: 600;
      color: #D1382A !important;
      font-family: 'Barlow Condensed', Helvetica, Arial, sans-serif;
    }

    .footer-social__title {
      margin: 0px;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-size: 14px !important;
      font-weight: 600;
      color: #D1382A !important;
      font-family: 'Barlow Condensed', Helvetica, Arial, sans-serif;
    }

    .message-footer table td.footer-social td {
      padding: 0px;
      padding-right: 10px;
    }

    /* ---- Extended footer content (brand info, nav, badges, payments) ---- */

    .rb-mail-eyebrow {
      color: #D1382A;
      font-family: 'Barlow Condensed', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0 0 6px 0;
    }

    .rb-mail-desc {
      color: #6E6A63;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 14px 0;
    }

    .rb-mail-badge {
      display: inline-block;
      padding: 4px 10px;
      margin: 0 6px 6px 0;
      border: 1px solid rgba(18,18,18,.08);
      font-size: 11px;
      color: #6E6A63;
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .rb-mail-badge.gold {
      border-color: #D1382A;
      color: #D1382A;
    }

    .rb-mail-nav-col-h {
      color: #121212;
      font-family: 'Barlow Condensed', Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin: 0 0 10px 0;
    }

    .rb-mail-nav-links {
      font-size: 13px;
      line-height: 2;
      color: #6E6A63;
    }

    .rb-mail-nav-links a {
      color: #6E6A63;
      text-decoration: none;
    }

    .rb-mail-divider td {
      border-top: 1px solid rgba(18,18,18,.08);
      font-size: 0;
      line-height: 0;
      padding: 0 !important;
    }

    .rb-mail-soc-btn {
      display: inline-block;
      padding: 6px 12px;
      margin: 0 0 8px 6px;
      border: 1px solid rgba(18,18,18,.08);
      font-size: 12px;
      color: #121212;
      text-decoration: none;
    }

    .rb-mail-pay-ic {
      display: inline-block;
      padding: 4px 8px;
      margin-left: 6px;
      border: 1px solid rgba(18,18,18,.08);
      font-size: 10px;
      color: #6E6A63;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .rb-mail-disclaimer {
      color: #9A958C;
      font-size: 11px;
    }

    .email-preview{
      display:none;
      font-size:1px;
      color:#333333;
      line-height:1px;
      max-height:0px;
      max-width:0px;
      opacity:0;
      overflow:hidden;
    }

    .with-subline {
      color: #121212;
      text-transform: uppercase;
      font-weight: bold;
      font-size: 1em;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(18,18,18,.08);
    }

    p {
      margin: 1em 0;
    }

    h1,h2,h3,h4,h5,h6 {
      color: #121212;
    }

    h1 a,h2 a,h3 a,h4 a,h5 a,h6 a {
      color: #D1382A;
    }

    h1 a:active,h2 a:active,h3 a:active,h4 a:active,h5 a:active,h6 a:active {
      color: #A82C20;
    }

    h1 a:visited,h2 a:visited,h3 a:visited,h4 a:visited,h5 a:visited,h6 a:visited {
      color: #A82C20;
    }

    table td,
    table th {
      border-collapse: collapse;
    }

    table {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    address {
      margin: 0px;
      font-style: normal;
      color: #6E6A63;
    }

    .content-wrapper {
      border: 1px solid rgba(18,18,18,.08);
      background-color: #FFFFFF;
    }

    .copyright td {
      padding: 10px 0 0 0;
      padding-bottom: 0 !important;
      color: #6E6A63;
      font-size: 12px;
    }

    a {
      color: #D1382A;
    }

    {% if language_direction == "rtl" %}

    .ty-email-footer {
      text-align: center !important;
    }

    .ty-email-footer-social-buttons {
      text-align: center !important;
    }

    .ty-email-footer-right-part {
      text-align: center !important;
      float: left !important;
    }

    .ty-email-footer-left-part {
      text-align: center !important;
      float: right !important;
    }

    {% endif %}

  </style>
</head>

<body>
    <style>

      @media only screen and (max-device-width: 480px){
        .content-wrapper{width: 100% !important; border: 1px solid rgba(18,18,18,.08) !important; }

        .message-header > td,
        .message-title > td,
        .message-body > td,
        .message-footer > td,
        .message-copyright > td {
          padding: 10px !important;
        }

        .message-header td,
        .message-title td,
        .message-body th, .message-body td,
        .message-footer th, .message-footer td,
        .message-copyright th, .message-copyright td {
          font-size: 16px !important;
        }
      }

      @media only screen and (min-device-width: 768px) and (max-device-width: 1024px) {}

      @media only screen and (-webkit-min-device-pixel-ratio: 2) {}

      @media only screen and (-webkit-device-pixel-ratio:.75) {}

      @media only screen and (-webkit-device-pixel-ratio:1) {}

      @media only screen and (-webkit-device-pixel-ratio:1.5) {}
    </style>
  <!-- Targeting Windows Mobile -->
  <!--[if IEMobile 7]>
  <style type="text/css">

  </style>
  <![endif]-->

  <!--[if gte mso 9]>

        /* Target Outlook 2007 and 2010 */

  <![endif]-->
  <table class="main-wrapper" cellpadding="0" cellspacing="0" width="100%" bgcolor="#FAF9F7" style="background-color: #FAF9F7" dir="{{ language_direction }}">
    <tr>
      <td style="padding: 40px 10px 40px 10px;">
        <table class="content-wrapper" cellpadding="0" cellspacing="0" align="center" width="600">
          <tr class="rb-mail-announce">
            <td>
              &#10022;&nbsp; Handmade to Order &nbsp;&#10022;&nbsp; Exclusively Crafted for the C6 Corvette &nbsp;&#10022;
            </td>
          </tr>
          <tr class="message-header">
            <td align="center">
              <table cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center"><a href="{{ storefront_data.url }}"><img src="{{logos.mail.image.image_path}}" alt="{{ company_data.company_name }}" width="{{logos.mail.image.image_x}}" height="{{logos.mail.image.image_y}}" style="width: auto; max-width: 200px; max-height: 80px;" /></a></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr class="message-body">

<td>
{% if title %}
<p class="rb-mail-title">{{title}}</p>
{% endif %}
