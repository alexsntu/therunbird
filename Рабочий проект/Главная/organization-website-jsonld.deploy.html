<script type="application/ld+json">
{literal}
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://therunbird.com/#organization",
      "name": "RunBird",
      "alternateName": "TheRunBird",
      "url": "https://therunbird.com/",
      "logo": {
        "@type": "ImageObject",
        "@id": "https://therunbird.com/#logo",
        "url": "https://therunbird.com/images/logos/9/Logowhite_3x.png"
      },
      "image": { "@id": "https://therunbird.com/#logo" },
      "description": "Handmade C6 Corvette interior accessories — steering wheels, shift knobs, handbrakes, horn pads, emblems, and door sill plates, built to order and shipped nationwide across the US.",
      "sameAs": [
        "https://www.instagram.com/therunbird",
        "https://youtube.com/@therunbird",
        "https://www.tiktok.com/@therunbird"
      ]
    },
    {
      "@type": "WebSite",
      "@id": "https://therunbird.com/#website",
      "url": "https://therunbird.com/",
      "name": "RunBird",
      "description": "Feel the Drive",
      "publisher": { "@id": "https://therunbird.com/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://therunbird.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  ]
}
{/literal}
</script>
