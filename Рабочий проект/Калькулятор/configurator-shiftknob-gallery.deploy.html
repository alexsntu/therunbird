  <div class="rb-cfg-gal-head">Recent builds</div>
  <div class="rb-cfg-gal-row">
    <button type="button" class="rb-cfg-gal-nav rb-cfg-gal-nav--prev" id="rb-cfg-gal-prev" aria-label="Scroll left">‹</button>

  </div>
</div>

  <img class="rb-cfg-lb-img" id="rb-cfg-lb-img" src="" alt="Custom shift knob build — full size">
  <button type="button" class="rb-cfg-lb-nav rb-cfg-lb-next" id="rb-cfg-lb-next" aria-label="Next photo">›</button>
</div>

<style>
#rb-cfg-gallery{
  --rb-accent:   #C8A84C;
  --rb-accent-b: rgba(200,168,76,.28);
  --rb-text:     #F0F0F0;
  --rb-border:   rgba(255,255,255,.08);
  --rb-border-s: rgba(255,255,255,.16);
  font-family:'Inter', sans-serif; color:var(--rb-text);
  margin-top:8px;
}
#rb-cfg-gallery *{ box-sizing:border-box; }
#rb-cfg-gallery .rb-cfg-gal-head{
  font-family:'Barlow Condensed', sans-serif; text-transform:uppercase; letter-spacing:.08em;
  font-size:18px; font-weight:600; margin-bottom:16px; text-align:center;
}
#rb-cfg-gallery .rb-cfg-gal-track{
  display:flex; gap:14px; overflow-x:auto; padding:2px 2px 12px; scroll-snap-type:x proximity; justify-content:center;
}
#rb-cfg-gallery .rb-cfg-gal-track::-webkit-scrollbar{ height:6px; }
#rb-cfg-gallery .rb-cfg-gal-track::-webkit-scrollbar-track{ background:transparent; }
#rb-cfg-gallery .rb-cfg-gal-track::-webkit-scrollbar-thumb{ background:var(--rb-border-s); border-radius:99px; }
#rb-cfg-gallery .rb-cfg-gal-item{
  position:relative; flex:0 0 auto; width:clamp(150px,17vw,210px); aspect-ratio:1/1;
  border-radius:14px; overflow:hidden; border:1px solid var(--rb-border); scroll-snap-align:start;
  cursor:zoom-in; transition:border-color .15s;
  background:
    radial-gradient(ellipse at 50% 38%, rgba(200,168,76,.18), transparent 55%),
    radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.08), transparent 60%),
    linear-gradient(180deg, #4a4a4a 0%, #333333 60%, #262626 100%);
}
#rb-cfg-gallery .rb-cfg-gal-item img{
  position:absolute; inset:0; margin:auto; width:82%; height:82%; object-fit:contain;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));
}
#rb-cfg-gallery .rb-cfg-gal-watermark{
  position:absolute; right:7%; bottom:7%; width:32%; height:auto; opacity:.24; pointer-events:none;
}
#rb-cfg-gallery .rb-cfg-gal-watermark path{ fill:#f1ebdb; }
#rb-cfg-gallery .rb-cfg-gal-item:hover{ border-color:var(--rb-accent-b); }
#rb-cfg-gallery .rb-cfg-gal-row{ position:relative; }
#rb-cfg-gallery .rb-cfg-gal-nav{
  position:absolute; top:50%; transform:translateY(-50%); z-index:3;
  width:38px; height:38px; border-radius:50%; flex:none;
  background:rgba(10,10,10,.8); border:1px solid var(--rb-border-s); color:var(--rb-text);
  font-size:19px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s;
}
#rb-cfg-gallery .rb-cfg-gal-nav:hover{ background:var(--rb-accent); color:#000; border-color:var(--rb-accent); }
#rb-cfg-gallery .rb-cfg-gal-nav--prev{ left:4px; }
#rb-cfg-gallery .rb-cfg-gal-nav--next{ right:4px; }

.rb-cfg-lightbox{
  position:fixed; inset:0; z-index:99999; background:rgba(4,4,4,.96);
  display:none; align-items:center; justify-content:center; padding:32px; box-sizing:border-box;
}
.rb-cfg-lightbox *{ box-sizing:border-box; }
.rb-cfg-lightbox.is-open{ display:flex; }
.rb-cfg-lb-img{
  max-width:min(88vw,900px); max-height:86vh; width:auto; height:auto; object-fit:contain;
  border-radius:16px; box-shadow:0 24px 48px rgba(0,0,0,.6);
}
.rb-cfg-lb-close,
.rb-cfg-lb-nav{
  position:absolute; border-radius:50%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);
  color:#F0F0F0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:.15s; font-family:'Inter',sans-serif;
}
.rb-cfg-lb-close:hover,
.rb-cfg-lb-nav:hover{ background:#C8A84C; color:#000; border-color:#C8A84C; }
.rb-cfg-lb-close{ top:24px; right:28px; width:42px; height:42px; font-size:17px; }
.rb-cfg-lb-nav{ top:50%; transform:translateY(-50%); width:54px; height:54px; font-size:26px; }
.rb-cfg-lb-prev{ left:24px; }
.rb-cfg-lb-next{ right:24px; }

html.rb-cfg-scroll-lock, body.rb-cfg-scroll-lock{ overflow:hidden !important; }
body.rb-cfg-scroll-lock{ position:fixed; left:0; right:0; width:100%; }

@media (max-width: 700px){
  #rb-cfg-gallery .rb-cfg-gal-nav{ display:none; }
  .rb-cfg-lb-nav{ display:none; }
  .rb-cfg-lb-img{ max-width:94vw; }
}
</style>

<script>
(function(){

  // Fill these in per variant when photos are ready — same keys as the configurator block.
  var GALLERY_DATA = {
    classic: [],
    ball: [],
    drift: [],
    cap: [],
    boot: []
  };

  var gallerySection = document.getElementById('rb-cfg-gallery');
  var galTrack = document.getElementById('rb-cfg-gal-track');
  var galSrcs = [];

  function renderGallery(key){
    galTrack.innerHTML = '';
    galSrcs = GALLERY_DATA[key] || [];
    if (!galSrcs.length){
      gallerySection.style.display = 'none';
      return;
    }
    gallerySection.style.display = '';
    galSrcs.forEach(function(src, i){
      var item = document.createElement('div');
      item.className = 'rb-cfg-gal-item';
      item.innerHTML =
        '<img src="'+src+'" alt="Custom shift knob build" loading="lazy">'+
        '<svg class="rb-cfg-gal-watermark" viewBox="0 0 272.43 107.57" aria-hidden="true"><use href="#rb-logo-mark"></use></svg>';
      item.addEventListener('click', function(){ openLightbox(i); });
      galTrack.appendChild(item);
    });
  }

  document.addEventListener('rb-shiftknob-variant', function(e){
    renderGallery(e.detail && e.detail.key);
  });

  document.getElementById('rb-cfg-gal-prev').addEventListener('click', function(){
    galTrack.scrollBy({ left: -Math.round(galTrack.clientWidth * 0.8), behavior: 'smooth' });
  });
  document.getElementById('rb-cfg-gal-next').addEventListener('click', function(){
    galTrack.scrollBy({ left: Math.round(galTrack.clientWidth * 0.8), behavior: 'smooth' });
  });

  var lightbox = document.getElementById('rb-cfg-lightbox');
  document.body.appendChild(lightbox);
  var lbImg = document.getElementById('rb-cfg-lb-img');
  var lbIndex = 0;

  var scrollLockY = 0;
  function lockPageScroll(){
    scrollLockY = window.scrollY || document.documentElement.scrollTop || 0;
    document.documentElement.classList.add('rb-cfg-scroll-lock');
    document.body.classList.add('rb-cfg-scroll-lock');
    document.body.style.top = (-scrollLockY) + 'px';
  }
  function unlockPageScroll(){
    document.documentElement.classList.remove('rb-cfg-scroll-lock');
    document.body.classList.remove('rb-cfg-scroll-lock');
    document.body.style.top = '';
    window.scrollTo(0, scrollLockY);
  }

  function openLightbox(i){
    lbIndex = i;
    lbImg.src = galSrcs[lbIndex];
    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden', 'false');
    lockPageScroll();
  }
  function closeLightbox(){
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
    unlockPageScroll();
  }
  function lbShift(delta){
    lbIndex = (lbIndex + delta + galSrcs.length) % galSrcs.length;
    lbImg.src = galSrcs[lbIndex];
  }

  document.getElementById('rb-cfg-lb-close').addEventListener('click', closeLightbox);
  document.getElementById('rb-cfg-lb-prev').addEventListener('click', function(e){ e.stopPropagation(); lbShift(-1); });
  document.getElementById('rb-cfg-lb-next').addEventListener('click', function(e){ e.stopPropagation(); lbShift(1); });
  lightbox.addEventListener('click', function(e){ if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', function(e){
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lbShift(-1);
    else if (e.key === 'ArrowRight') lbShift(1);
  });

})();
</script>
