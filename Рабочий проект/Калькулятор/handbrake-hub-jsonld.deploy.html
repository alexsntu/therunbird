<!-- ══════════════════════════════════════════════════════
     RunBird — /handbrakes/ hub page: ItemList JSON-LD
     CS-Cart > Design > Layouts > Html+Smarty block, add as a NEW content
     block on this page only (same pattern as shiftknob-hub-jsonld.deploy.html
     — separate block, not merged into configurator-handbrake.deploy.html).
     Cache: can be ENABLED (fully static, no Smarty dynamic data)

     Purpose: this hub links to 3 e-brake accessory styles, each now living

     ItemList below formally declares that relationship for AI/knowledge-
     graph consumers — only "url" per item, no embedded Product/price

     HTML+Smarty.

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "CollectionPage",
      "@id": "https://therunbird.com/handbrakes/#webpage",
      "url": "https://therunbird.com/handbrakes/",
      "name": "Custom C6 Corvette E-Brake Accessories",
      "about": { "@id": "https://therunbird.com/handbrakes/#itemlist" }
    },
    {
      "@type": "ItemList",
      "@id": "https://therunbird.com/handbrakes/#itemlist",
      "name": "E-Brake Accessories",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Handle + CF Button", "url": "https://therunbird.com/handbrakes/handbrake/" },
        { "@type": "ListItem", "position": 2, "name": "Knob Boot", "url": "https://therunbird.com/handbrakes/handbrake-cover/" },
        { "@type": "ListItem", "position": 3, "name": "Handle Button", "url": "https://therunbird.com/handbrakes/handbrake-button/" }
      ]
    }
  ]
}
</script>
