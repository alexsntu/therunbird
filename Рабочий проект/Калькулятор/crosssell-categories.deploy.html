<style>
#rb-crosssell{

  --rb-border:   rgba(255,255,255,.08);

  box-sizing:border-box;
}
#rb-crosssell *{ box-sizing:border-box; }
#rb-crosssell .rb-crosssell-head{

  font-size:16px; font-weight:600; color:var(--rb-accent); margin:0 0 14px; text-align:center;
}
/* Desktop: all 6 tiles in a single row, evenly filling the container
   width — square via aspect-ratio on the card, so tile size just follows
   whatever the column width comes out to. */
#rb-crosssell .rb-crosssell-grid{
  display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:14px;
}
#rb-crosssell .rb-crosssell-card{
  position:relative; display:block; aspect-ratio:1/1; border-radius:10px; overflow:hidden;
  border:1px solid var(--rb-border); background:#111; text-decoration:none; transition:border-color .2s;
}
#rb-crosssell .rb-crosssell-card:hover{ border-color:var(--rb-accent-b); }
#rb-crosssell .rb-crosssell-card img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top;
  transition:transform .5s;
}
#rb-crosssell .rb-crosssell-card:hover img{ transform:scale(1.06); }
#rb-crosssell .rb-crosssell-card::after{
  content:''; position:absolute; inset:0; z-index:1;
  background:linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.3) 55%, transparent 100%);
}
#rb-crosssell .rb-crosssell-name{
  position:absolute; left:0; right:0; bottom:0; z-index:2; padding:10px 10px;
  font-family:'Barlow Condensed', sans-serif; text-transform:uppercase; letter-spacing:.03em;
  font-size:16px; font-weight:700; color:var(--rb-text);
}

/* Mobile: 2 columns so the 6 tiles wrap into 3 rows of 2 — bigger tiles
   than a 3-per-row layout. Square via aspect-ratio, size follows the
   column width rather than a fixed 250px. */
@media (max-width: 900px){
  #rb-crosssell .rb-crosssell-grid{ grid-template-columns:repeat(2, 1fr); }
  #rb-crosssell .rb-crosssell-name{ font-size:14px; }
}
</style>
