<!-- ══════════════════════════════════════════════════════
     RunBird — Warranty Block 1: Hero
     CS-Cart > Design > Layouts > Html+Smarty block (Content area, top of Warranty page)
     Cache: can be ENABLED (fully static, no Smarty dynamic data)
     All styles scoped under #rb-wty-hero — no conflict with UniTheme2
════════════════════════════════════════════════════════ -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@300;400;500;600&display=swap');

#rb-wty-hero,
#rb-wty-hero *,
#rb-wty-hero *::before,
#rb-wty-hero *::after {
  box-sizing: border-box !important;
}
#rb-wty-hero a { text-decoration: none !important; }

#rb-wty-hero {
  --rb-bg:         #080808;
  --rb-accent:     #C8A84C;
  --rb-accent-b:   rgba(200,168,76,.28);
  --rb-text:       #F0F0F0;
  --rb-text2:      #808080;
  --rb-border:     rgba(255,255,255,.07);

  display: block !important;
  width: 100% !important;
  font-family: 'Inter', sans-serif !important;
  background: var(--rb-bg) !important;
  position: relative !important;
  overflow: hidden !important;
  margin: 0 !important;
  padding: 0 !important;
}
#rb-wty-hero .rb-wh-glow {
  position: absolute !important; inset: 0 !important; pointer-events: none !important;
  background:
    radial-gradient(ellipse 60% 70% at 50% 0%, rgba(200,168,76,.14) 0%, transparent 65%) !important;
}
#rb-wty-hero .rb-wh-cf {
  position: absolute !important; inset: 0 !important;
  background-image:
    repeating-linear-gradient( 45deg, rgba(255,255,255,.009) 0, rgba(255,255,255,.009) 1px, transparent 1px, transparent 50%),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.009) 0, rgba(255,255,255,.009) 1px, transparent 1px, transparent 50%) !important;
  background-size: 10px 10px !important;
}

#rb-wty-hero .rb-wh-inner {
  position: relative !important; z-index: 1 !important;
  max-width: 860px !important;
  margin: 0 auto !important;
  padding: 72px 48px 56px !important;
  text-align: center !important;
}
#rb-wty-hero .rb-wh-eyebrow {
  display: inline-flex !important; align-items: center !important; gap: 9px !important;
  padding: 6px 18px !important; border-radius: 100px !important;
  border: 1px solid var(--rb-accent-b) !important;
  color: var(--rb-accent) !important; font-size: 11px !important; font-weight: 700 !important;
  letter-spacing: .18em !important; text-transform: uppercase !important;
  margin-bottom: 26px !important;
  background: rgba(200,168,76,.06) !important;
}
#rb-wty-hero .rb-wh-h1 {
  font-family: 'Barlow Condensed', sans-serif !important;
  font-weight: 900 !important;
  font-size: clamp(36px, 5.4vw, 64px) !important;
  line-height: .98 !important;
  text-transform: uppercase !important;
  color: var(--rb-text) !important;
  margin: 0 0 22px !important;
}
#rb-wty-hero .rb-wh-h1 em {
  color: var(--rb-accent) !important;
  font-style: italic !important;
  text-shadow: 0 0 30px rgba(200,168,76,.45) !important;
}
#rb-wty-hero .rb-wh-p {
  font-size: 15.5px !important;
  color: #999 !important;
  line-height: 1.75 !important;
  font-weight: 300 !important;
  max-width: 620px !important;
  margin: 0 auto 40px !important;
}
#rb-wty-hero .rb-wh-p strong { color: #ccc !important; font-weight: 500 !important; }

/* ── Quick nav chips ── */
#rb-wty-hero .rb-wh-chips {
  display: flex !important;
  justify-content: center !important;
  flex-wrap: wrap !important;
  gap: 12px !important;
}
#rb-wty-hero .rb-wh-chip {
  display: inline-flex !important;
  align-items: center !important;
  padding: 11px 22px !important;
  border: 1px solid rgba(255,255,255,.13) !important;
  border-radius: 100px !important;
  background: rgba(255,255,255,.03) !important;
  color: #C8C8C8 !important;
  font-family: 'Barlow Condensed', sans-serif !important;
  font-size: 15px !important;
  font-weight: 700 !important;
  letter-spacing: .04em !important;
  text-transform: uppercase !important;
  transition: border-color .2s, color .2s, background .2s !important;
}
#rb-wty-hero .rb-wh-chip:hover {
  border-color: var(--rb-accent) !important;
  color: var(--rb-text) !important;
  background: rgba(200,168,76,.07) !important;
}

/* ══════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════ */
@media (max-width: 768px) {
  #rb-wty-hero .rb-wh-inner { padding: 48px 20px 40px !important; }
  #rb-wty-hero .rb-wh-chips { gap: 8px !important; }
  #rb-wty-hero .rb-wh-chip { padding: 9px 16px !important; font-size: 13px !important; }
}
</style>

<div id="rb-wty-hero">
  <div class="rb-wh-glow"></div>
  <div class="rb-wh-cf"></div>
  <div class="rb-wh-inner">
    <span class="rb-wh-eyebrow">Warranty</span>
    <h1 class="rb-wh-h1">Built To Last.<br><em>Backed For 12 Months.</em></h1>
    <p class="rb-wh-p">
      Every RunBird piece is covered by a <strong>12-month workmanship warranty</strong> from the day it's
      delivered. If something fails because of how it was made — not how it was used — we'll repair, remake,
      or replace it.
    </p>
    <div class="rb-wh-chips">
      <a href="#covered" class="rb-wh-chip">What's Covered</a>
      <a href="#claim" class="rb-wh-chip">File A Claim</a>
      <a href="#faq" class="rb-wh-chip">FAQ</a>
    </div>
  </div>
</div>
