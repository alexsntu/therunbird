<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How long does the warranty last?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "12 months from the day your order is delivered. It covers workmanship and material defects — not wear and tear from normal use."
      }
    },
    {
      "@type": "Question",
      "name": "Does it cover my leather softening or fading over time?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No — that's normal wear, not a defect. Following the care routine in our Materials Guide will help slow it down and keep your piece looking its best."
      }
    },
    {
      "@type": "Question",
      "name": "I installed it myself and now something's wrong — is that covered?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "If the problem is a genuine defect in how the piece was built, yes — installing it yourself doesn't void that. If the issue was caused by how it was installed, that falls outside the warranty. See our Installation Help guide for the correct process."
      }
    },
    {
      "@type": "Question",
      "name": "What if my order arrived damaged in shipping?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "That's handled separately from this warranty — see our Shipping & Returns page for how we handle damage that happens in transit."
      }
    },
    {
      "@type": "Question",
      "name": "What do I need to file a claim?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Your order number, clear photos of the issue, and a short description of what's wrong. Contact our support team and we'll take it from there."
      }
    }
  ]
}
</script>
